services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"

      NEXT_TELEMETRY_DISABLED: "1"

      # Valores tomados del entorno del host / archivo .env de Compose.
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}

    # Política de reinicio automático del motor de Docker (no es "restart si falla el build").
    restart: unless-stopped
