# =============================================================================
# ENTORNO DE PRODUCCIÓN — imagen optimizada (standalone + usuario no root)
# =============================================================================
# Qué hace este archivo:
#   Construye el Dockerfile multi-stage y ejecuta el servidor Node embebido en
#   el bundle standalone (`node server.js`), equivalente a `next start` pero
#   con menos archivos en la imagen final.
#
# Cómo usarlo:
#   docker compose -f docker-compose.prod.yml up --build
#
# Secretos / correo (API /api/contact):
#   Compose sustituye ${EMAIL_USER} y ${EMAIL_PASS} leyendo un archivo `.env`
#   en la MISMA carpeta que este YAML (por convención), o variables ya exportadas
#   en tu shell. Esas variables NO se copian dentro de la imagen en el build:
#   solo se inyectan al arrancar el contenedor (mejor práctica de seguridad).
#
# Reinicios:
#   `restart: unless-stopped` hace que el contenedor vuelva a levantarse tras
#   reinicios del host (útil en un VPS con Docker solo, no sustituye a un orquestador).
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      # Tráfico HTTP de la app (TLS lo suele terminar un reverse proxy delante).
      - "3000:3000"

    environment:
      # Producción estricta para Node y muchas librerías.
      NODE_ENV: production

      # Misma razón que en el Dockerfile: el servidor debe escuchar en todas las
      # interfaces de red del contenedor para que el mapeo de puertos funcione.
      HOSTNAME: 0.0.0.0
      PORT: "3000"

      NEXT_TELEMETRY_DISABLED: "1"

      # Valores tomados del entorno del host / archivo .env de Compose.
      # La sintaxis ${VAR:-} significa: si no está definida, usar cadena vacía
      # (evita error de sustitución; igual deberías definirlas para que el correo funcione).
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}

    # Política de reinicio automático del motor de Docker (no es "restart si falla el build").
    restart: unless-stopped
